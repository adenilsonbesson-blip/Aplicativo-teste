name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar ambiente e Keystore de Debug
        run: |
          # Criar arquivo .env se não existir
          touch .env
          
          # Restaurar debug.keystore a partir do base64 ou criar nova
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Baixar gradle-wrapper.jar caso não esteja commitado
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Baixando gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar || true
          fi
          
          chmod +x gradlew || true

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug -x test --no-daemon --stacktrace

      - name: Fazer Upload do APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: aqua-alerta-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
